<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Tablero</title>
<meta id="metaTheme" name="theme-color" content="#09101f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Tablero"/>
<script>try{var _t=localStorage.getItem('tablero_theme')||'dark';document.documentElement.setAttribute('data-theme',_t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root,html[data-theme="dark"]{
  --bg:#09101f;--bg2:#111e33;--surface:#0d1627;--surface2:#172440;
  --line:#1e2e4a;--lineS:#2a3f5f;--text:#F0F4FF;--muted:#7B8DB0;
  --amber:#F5B13D;--amberDim:#5a3d0f;
  --green:#22C55E;--green-s:rgba(34,197,94,.13);--green-b:rgba(34,197,94,.38);
  --red:#EF4444;--red-s:rgba(239,68,68,.12);--red-b:rgba(239,68,68,.35);
  --blue:#4F6EF7;--blue2:#6B85FF;--blue-s:rgba(79,110,247,.14);--blue-b:rgba(79,110,247,.35);
  --purple:#A78BFA;--teal:#14B8A6;--pink:#EC4899;--orange:#F97316;
  --tick:rgba(255,255,255,.07);--ph:rgba(255,255,255,.2);--insetHi:rgba(255,255,255,.03);
  --shadow:0 6px 24px rgba(0,0,0,.4);--nav-bg:rgba(9,16,31,.96);
  --radialA:#0f1f3a;--accGlow:rgba(79,110,247,.4);--redGlow:rgba(239,68,68,.32);
  --onAccent:#fff;--onGreen:#022916;--onBlue:#030d2b;--delDot:rgba(255,255,255,.14);
  --mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
html[data-theme="light"]{
  --bg:#F8FAFC;--bg2:#F1F5F9;--surface:#FFFFFF;--surface2:#EEF2FF;
  --line:#E2E8F0;--lineS:#CBD5E1;--text:#0F172A;--muted:#64748B;
  --amber:#B45309;--amberDim:#e9c88a;
  --green:#16A34A;--green-s:rgba(22,163,74,.1);--green-b:rgba(22,163,74,.38);
  --red:#DC2626;--red-s:rgba(220,38,38,.09);--red-b:rgba(220,38,38,.35);
  --blue:#2563EB;--blue2:#3b6fd4;--blue-s:rgba(37,99,235,.09);--blue-b:rgba(37,99,235,.35);
  --purple:#7C3AED;--teal:#0D9488;--pink:#DB2777;--orange:#C2410C;
  --tick:rgba(0,0,0,.07);--ph:rgba(0,0,0,.28);--insetHi:rgba(255,255,255,.6);
  --shadow:0 4px 14px rgba(15,23,42,.08);--nav-bg:rgba(255,255,255,.94);
  --radialA:#dde8f8;--accGlow:transparent;--redGlow:transparent;
  --onAccent:#fff;--onGreen:#fff;--onBlue:#fff;--delDot:rgba(0,0,0,.22);
  --mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none;font-variant-numeric:tabular-nums}
html.hidebal .r-val,html.hidebal .acct-net span,html.hidebal .acct-card .ab,html.hidebal .stat-num,html.hidebal .g-nums,html.hidebal .g-pct,html.hidebal .tx .a,html.hidebal .acct-edit .bal,html.hidebal .sub-next .big-days,html.hidebal .aln b,html.hidebal .li b,html.hidebal .g-left{filter:blur(9px);transition:filter .15s}
input,select,button{font-family:inherit}button{cursor:pointer}
.shell{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:radial-gradient(110% 50% at 50% -5%,var(--radialA) 0%,var(--bg) 60%);display:flex;flex-direction:column}
.fade{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}

/* ── Header ── */
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 8px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.brand svg circle,.brand svg line{stroke:var(--blue2)}
.brand svg .fillc{fill:var(--blue2);stroke:none}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.5px}
.ver{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);padding:1px 5px;border-radius:6px;margin-left:2px}
.hbtns{display:flex;gap:6px}
.rst{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.rst:active{color:var(--text);background:var(--bg2)}
.rst svg{width:17px;height:17px}
main{flex:1;overflow-y:auto;padding:2px 16px 110px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px}

/* ── Readout / Balance ── */
.readout{background:linear-gradient(160deg,#141f3d 0%,#0d1627 55%,#131928 100%);border:1px solid rgba(79,110,247,.22);border-radius:24px;padding:22px 20px 18px;text-align:center;box-shadow:inset 0 1px 0 rgba(79,110,247,.1),var(--shadow);position:relative;overflow:hidden}
html[data-theme="light"] .readout{background:linear-gradient(160deg,#dde8f8 0%,#f0f5ff 55%,#eef2ff 100%);border-color:rgba(37,99,235,.18)}
.readout::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(79,110,247,.13) 0%,transparent 70%);top:-80px;left:50%;transform:translateX(-50%);pointer-events:none}
.r-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.r-val{font-family:var(--mono);font-weight:700;font-size:36px;letter-spacing:-1px;color:var(--blue2);margin:5px 0 4px;text-shadow:0 0 28px var(--accGlow)}
.r-val.neg{color:var(--red);text-shadow:0 0 22px var(--redGlow)}
.r-sub{font-size:13px;color:var(--muted)}.r-sub b{color:var(--green)}

/* ── Stats grid (Lazarev 1px gap) ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stat-item{background:var(--surface);padding:16px 15px}
.stat-icon2{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.9rem;margin-bottom:12px}
.stat-num{font-family:var(--mono);font-weight:700;font-size:19px;line-height:1;color:var(--text)}
.stat-label{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500}
.stat-change{font-size:10.5px;font-weight:700;margin-top:5px}
.stat-change.up{color:var(--green)}.stat-change.dn{color:var(--red)}.stat-change.neu{color:var(--muted)}
.delta{display:block;font-size:11px;font-weight:500;margin-top:5px}
.delta.g{color:var(--green)}.delta.b{color:var(--red)}.delta.neu{color:var(--muted)}

/* ── Account cards ── */
.acct-head{display:flex;align-items:center;justify-content:space-between;margin:2px}
.acct-net{font-family:var(--mono);font-weight:700;font-size:13px}
.acct-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.acct-scroll::-webkit-scrollbar{display:none}
.acct-card{flex:0 0 auto;min-width:140px;border-radius:16px;padding:14px;position:relative;overflow:hidden}
.acct-card .ah{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;margin-bottom:24px}
.acct-card .ab{font-family:var(--mono);font-weight:700;font-size:16px}
.acct-card .adeuda{font-size:10px;color:#fca5a5;font-family:var(--mono);margin-top:1px}
.acct-color-pick{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:2px}
.acol{width:100%;aspect-ratio:1;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:transform .12s,border-color .1s}
.acol.sel{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.acct-add{flex:0 0 auto;min-width:74px;background:var(--bg2);border:1px dashed var(--lineS);border-radius:16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.acct-add svg{width:18px;height:18px}

/* ── Category grid (for picker) ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg2);border:2px solid transparent;border-radius:14px;padding:12px 6px;cursor:pointer;transition:all .15s}
.cat-item.sel{border-color:var(--blue);background:var(--blue-s)}
.cat-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
.cat-name{font-size:.6rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.3}
.cat-item.sel .cat-name{color:var(--blue2)}

/* ── Method chips ── */
.method-row{display:flex;flex-wrap:wrap;gap:7px}
.mchip{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1.5px solid var(--lineS);color:var(--muted);font-size:12.5px;padding:7px 12px;border-radius:20px;font-weight:500;transition:all .12s}
.mchip.sel{border-color:var(--blue);color:var(--blue2);background:var(--blue-s)}

/* ── Transaction list ── */
.tx-date{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:10px 2px 5px}
.tx{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:4px}
.tx-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .c{font-size:14px;font-weight:600}
.tx .no{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.tx .a{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
.tx .del{background:none;border:none;color:var(--delDot);padding:4px;display:grid;place-items:center}
.tx .del:active{color:var(--red)}
.tx-badge{display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:100vw;margin-top:3px}

/* ── Goals ── */
.goal-hero,.goal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px;width:100%;text-align:left;color:var(--text)}
.g-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.g-emoji{font-size:28px}.g-name{font-weight:600;font-size:15px}
.g-nums{font-family:var(--mono);font-size:13px;color:var(--blue2);margin-top:2px}.g-nums span{color:var(--muted)}
.g-pct{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--blue2);margin-left:auto}
.gauge-track{position:relative;height:10px;background:var(--bg2);border:1px solid var(--lineS);border-radius:20px;overflow:hidden}
.gauge-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:20px;transition:width .6s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 10px var(--accGlow)}
.gauge-tick{position:absolute;top:0;width:1px;height:100%;background:var(--tick)}
.gauge-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;padding:0 2px}
.g-left{font-size:12.5px;color:var(--muted);margin-top:8px}
.g-actions{display:flex;gap:8px;margin-top:12px}
.g-abonar{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--blue-s);border:1px solid var(--blue-b);color:var(--blue2);font-weight:600;font-size:14px;padding:10px;border-radius:12px}
.g-edit,.g-del{background:var(--bg2);border:1px solid var(--lineS);color:var(--muted);width:44px;border-radius:12px;display:grid;place-items:center}
.g-edit:active{color:var(--blue2)}.g-del:active{color:var(--red)}

/* ── Budget bars ── */
.section{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin:6px 2px 2px}
.assign{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px}
.aln{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0}.aln b{font-family:var(--mono);color:var(--text)}
.aln.big{font-size:15px}.aln.big span{color:var(--text);font-weight:600}.aln.big b{font-size:17px}
.adiv{height:1px;background:var(--lineS);margin:6px 0}
.ahint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.brow{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}
.bhead{display:flex;align-items:center;gap:10px}
.bname{flex:1;font-size:14px;font-weight:500}
.binput{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--lineS);border-radius:10px;padding:4px 10px;width:96px}
.binput span{color:var(--muted);font-family:var(--mono);font-size:13px}
.binput input{width:100%;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:14px;text-align:right;padding:4px}
.binput input::placeholder{color:var(--ph)}
.bfoot{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;font-family:var(--mono)}
.budget-bar{height:6px;background:var(--bg2);border-radius:100vw;overflow:hidden;margin-top:8px}
.budget-fill{height:100%;border-radius:100vw;transition:width .8s cubic-bezier(.2,.7,.2,1)}

/* ── Subs ── */
.sub-next{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:20px;padding:17px;display:flex;align-items:center;gap:14px}
.sub-next .big-days{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;color:var(--blue2);text-shadow:0 0 20px var(--accGlow)}
.sub-next .dl{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.15em}
.sub-next .who{font-size:13px;color:var(--muted)}.sub-next .who b{color:var(--text);font-size:15px;display:block}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}
.sub-top{display:flex;align-items:center;gap:11px}
.sub .em{font-size:20px}.sub .info{flex:1;min-width:0}
.sub .nm{font-size:14px;font-weight:600}
.sub .meta{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.badge{font-family:var(--mono);font-weight:700;font-size:12px;padding:4px 9px;border-radius:8px;white-space:nowrap}
.badge.soon{background:var(--red-s);color:var(--red)}
.badge.near{background:var(--blue-s);color:var(--blue2)}
.badge.ok{background:var(--green-s);color:var(--green)}
.sub-act{display:flex;gap:8px;margin-top:10px}
.paid{flex:1;background:var(--green-s);border:1px solid var(--green-b);color:var(--green);font-weight:600;font-size:13px;padding:9px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px}
.paid svg{width:15px;height:15px}
.sdel,.sedit{background:var(--bg2);border:1px solid var(--lineS);color:var(--muted);width:42px;border-radius:11px;display:grid;place-items:center}
.sdel:active{color:var(--red)}.sedit:active{color:var(--blue2)}

/* ── Forms / Cards ── */
.metas-head{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.mini{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px}
.mini svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px;display:flex;flex-direction:column;gap:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg2);padding:4px;border-radius:13px}
.seg.tri{grid-template-columns:1fr 1fr 1fr}
.seg button{border:none;background:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:9px;border-radius:10px}
.seg button.on.red{background:var(--red);color:#fff}
.seg button.on.green{background:var(--green);color:#022916}
.seg button.on.blue{background:var(--blue);color:#fff}
.seg button.on.amber{background:var(--amber);color:#1a0d00}
.amt{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--lineS);border-radius:14px;padding:6px 16px}
.amt.sm{padding:4px 14px}
.amt span{font-family:var(--mono);font-size:24px;color:var(--muted)}.amt.sm span{font-size:18px}
.amt input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-weight:700;font-size:26px;width:100%;padding:6px 8px}
.amt.sm input{font-size:18px}
.amt input::placeholder{color:var(--ph)}
.flabel{font-size:10px;font-weight:600;color:var(--muted);margin:4px 2px 7px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.flabel-link{font-size:10px;color:var(--blue2);font-weight:600;background:none;border:none;padding:0;cursor:pointer;letter-spacing:0;text-transform:none;display:flex;align-items:center;gap:3px}
.flabel-link svg{width:11px;height:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--lineS);color:var(--muted);font-size:12.5px;padding:7px 12px;border-radius:20px;font-weight:500}
.chip.sel{border-color:var(--blue);color:var(--blue2);background:var(--blue-s)}
.chip.selb{border-color:var(--green);color:var(--green);background:var(--green-s)}
.frow{display:grid;grid-template-columns:1fr auto;gap:8px}
.txt{background:var(--bg2);border:1px solid var(--lineS);border-radius:13px;color:var(--text);font-size:14px;padding:11px 13px;outline:none;width:100%}
.txt:focus{border-color:var(--blue)}.txt::placeholder{color:var(--muted)}.txt.date{color:var(--muted)}
.add{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;border:none;font-weight:700;font-size:15px;padding:13px;border-radius:14px}
.add svg{width:18px;height:18px}.add:active{filter:brightness(1.12)}
.add.blue{background:var(--blue);color:#fff}
.add.ghost{background:var(--bg2);border:1px solid var(--lineS);color:var(--text)}
.empty{color:var(--muted);font-size:13px;background:var(--surface);border:1px dashed var(--lineS);border-radius:16px;padding:16px;text-align:center;line-height:1.6}
.empty.big{padding:28px 20px}
.install{background:linear-gradient(120deg,var(--blue-s),transparent);border:1px solid var(--blue-b);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.install b{color:var(--blue2)}
.install .x{margin-left:auto;color:var(--muted);background:none;border:none;font-size:18px;line-height:1;padding:0 2px}
.month{display:flex;align-items:center;justify-content:center;gap:16px;padding:2px 0}
.month b{font-size:15px;font-weight:600;text-transform:capitalize;min-width:100px;text-align:center}
.month button{background:none;border:none;color:var(--muted);padding:4px;border-radius:8px;display:grid;place-items:center}
.month button:active{color:var(--blue2);background:var(--surface)}
.tip{background:var(--blue-s);border:1px solid var(--blue-b);border-radius:15px;padding:13px 15px;font-size:13px;line-height:1.5}.tip b{color:var(--green)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px 15px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;position:relative}
.donut::after{content:"";position:absolute;inset:26px;background:var(--surface);border-radius:50%}
.legend{flex:1;display:flex;flex-direction:column;gap:7px}
.li{display:flex;align-items:center;gap:8px;font-size:12.5px}.li .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.li .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li b{font-family:var(--mono)}

<script>
const STORE="tablero_v1";
const THEME_KEY="tablero_theme";
const HIDE_KEY="tablero_hidebal";

const DEF_CATS={
  exp:[
    {id:'ec01',name:'Casa',emoji:'🏠',color:'#14B8A6'},
    {id:'ec02',name:'Comida',emoji:'🥑',color:'#F59E0B'},

    {id:'ec06',name:'Deudas',emoji:'💳',color:'#EF4444'},
    {id:'ec07',name:'Salud y Cuerpo',emoji:'💪',color:'#22C55E'},
    {id:'ec08',name:'Suscripciones',emoji:'📺',color:'#A78BFA'},
    {id:'ec09',name:'Cuidado personal',emoji:'💅',color:'#F97316'},
    {id:'ec10',name:'Entretenimiento',emoji:'🎬',color:'#F97316'},
    {id:'ec11',name:'Trading',emoji:'📈',color:'#22C55E'},
    {id:'ec12',name:'Plan móvil',emoji:'📱',color:'#4F6EF7'},
    {id:'ec13',name:'Educación',emoji:'📚',color:'#A78BFA'},
    {id:'ec14',name:'Crypto',emoji:'🪙',color:'#F59E0B'},
    {id:'ec15',name:'Ahorro respaldo',emoji:'💰',color:'#22C55E'},
    {id:'ec16',name:'E-commerce',emoji:'🛒',color:'#14B8A6'},
    {id:'ec17',name:'Otros',emoji:'⚫',color:'#64748B'},
  ],
  inc:[
    {id:'ic01',name:'Sueldo',emoji:'💼',color:'#22C55E'},
    {id:'ic02',name:'Ventas',emoji:'🛒',color:'#4F6EF7'},
    {id:'ic03',name:'Trading',emoji:'📈',color:'#F59E0B'},
    {id:'ic04',name:'Otros',emoji:'➕',color:'#64748B'},
  ]
};
const DEF_METHODS=[
  {id:'m1',name:'Efectivo',emoji:'💵'},
  {id:'m2',name:'Débito',emoji:'💳'},
  {id:'m3',name:'Transferencia',emoji:'🔄'},
  {id:'m4',name:'Crédito',emoji:'🧾'},
  {id:'m5',name:'Otro',emoji:'➕'},
];
const CAT_COLORS=['#4F6EF7','#22C55E','#F59E0B','#EF4444','#A78BFA','#14B8A6','#EC4899','#F97316','#06B6D4','#84CC16','#FB923C','#64748B'];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const EMOJIS=["💵","🏦","💳","🪙","📈","💰","🏧","👛","💼","🐷","🤑","💎","🏆","🎯","🛻","🚗","🏠","✈️","🧳","🎓","💻","📱","📺","🎮","🎵","☁️","🏋️","💡","🍽️","🛒","📦","🏥","👕","🎁","🐶","🌱","⚽","📚","🔧","💊","🎨","☕","🍺","🧾","🚀","❤️","🔄","➕","⚫"];
const ACCT_TYPES=[{t:"cash",label:"Efectivo",emoji:"💵"},{t:"bank",label:"Banco",emoji:"🏦"},{t:"debit",label:"Tarjeta de débito",emoji:"💳"},{t:"card",label:"Tarjeta de crédito",emoji:"🧾"},{t:"crypto",label:"Cripto / Exchange",emoji:"🪙"},{t:"invest",label:"Inversión",emoji:"📈"},{t:"other",label:"Otro",emoji:"👛"}];
const ACCT_COLORS=["blue","green","purple","teal","dark","dark","dark","dark"];
const ACCT_COLOR_OPTS=[
  {id:"blue",     bg:"linear-gradient(135deg,#1e3a8a,#2563EB)"},
  {id:"indigo",   bg:"linear-gradient(135deg,#1e1b4b,#4338ca)"},
  {id:"violet",   bg:"linear-gradient(135deg,#2e1065,#7c3aed)"},
  {id:"purple",   bg:"linear-gradient(135deg,#4c1d95,#9333ea)"},
  {id:"fuchsia",  bg:"linear-gradient(135deg,#701a75,#c026d3)"},
  {id:"pink",     bg:"linear-gradient(135deg,#831843,#db2777)"},
  {id:"rose",     bg:"linear-gradient(135deg,#881337,#e11d48)"},
  {id:"red",      bg:"linear-gradient(135deg,#7f1d1d,#dc2626)"},
  {id:"orange",   bg:"linear-gradient(135deg,#7c2d12,#ea580c)"},
  {id:"amber",    bg:"linear-gradient(135deg,#78350f,#d97706)"},
  {id:"yellow",   bg:"linear-gradient(135deg,#713f12,#ca8a04)"},
  {id:"lime",     bg:"linear-gradient(135deg,#1a2e05,#65a30d)"},
  {id:"green",    bg:"linear-gradient(135deg,#065f46,#059669)"},
  {id:"emerald",  bg:"linear-gradient(135deg,#064e3b,#10b981)"},
  {id:"teal",     bg:"linear-gradient(135deg,#0f4c45,#0d9488)"},
  {id:"cyan",     bg:"linear-gradient(135deg,#0c4a6e,#0891b2)"},
  {id:"sky",      bg:"linear-gradient(135deg,#0c3e60,#0284c7)"},
  {id:"slate",    bg:"linear-gradient(135deg,#0f172a,#475569)"},
  {id:"zinc",     bg:"linear-gradient(135deg,#18181b,#71717a)"},
  {id:"dark",     bg:"var(--surface)"},
];

function todayISO(){return new Date().toISOString().slice(0,10);}
function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}

const DEF_ACCOUNTS=[
  {id:"a_cash",name:"Efectivo",type:"cash",opening:0,emoji:"💵",color:"green"},
  {id:"a_bank",name:"Cuenta de ahorros",type:"bank",opening:0,emoji:"🏦",color:"blue"},
  {id:"a_credit",name:"Tarjeta de crédito",type:"card",opening:0,emoji:"💳",color:"dark"},
];
const DEF_GOALS=[{id:"g_zr2",name:"Chevrolet Colorado ZR2",target:65000,saved:0,emoji:"🛻"}];
const DEF_SUBS=[
  {id:"s1",name:"Plan móvil",amount:15,cycle:"monthly",next:plusDays(12),emoji:"📱"},
  {id:"s2",name:"Darwinex Zero",amount:50,cycle:"monthly",next:plusDays(24),emoji:"📈"},
];

let state={accounts:[],transactions:[],budgets:{},goals:[],subs:[],cats:{exp:[],inc:[]},methods:[]};
let ui={
  tab:"resumen",month:mkey(new Date()),
  addGoal:false,addSub:false,addAcct:false,contribFor:null,
  editAcct:null,editGoal:null,editSub:null,payingSub:null,
  subPay:{account:null,method:null},
  payForm:{type:"expense",cat:"Comida",account:null,from:null,to:null,method:null,amt:"",note:"",date:""},
  subForm:{cycle:"monthly",emoji:"🔁",name:"",amt:"",date:""},
  goalEmoji:"🎯",goalName:"",goalTarget:"",
  acctForm:{type:"bank",emoji:"🏦",name:"",opening:"",color:"blue"},
  installHidden:false,
  cfg:{section:'cats',catType:'exp',addCat:false,editCatId:null,catForm:{name:'',emoji:'💰',color:'#4F6EF7'},
       addMethod:false,editMethodId:null,methodForm:{name:'',emoji:'💵'}}
};

function mkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}

function load(){
  let has=false;
  try{
    const raw=localStorage.getItem(STORE);
    if(raw){has=true;const d=JSON.parse(raw);
      state={accounts:d.accounts||[],transactions:d.transactions||[],budgets:d.budgets||{},goals:d.goals||[],subs:d.subs||[],cats:{exp:[],inc:[]},methods:[]};
      state.cats=(d.cats&&d.cats.exp&&d.cats.exp.length)?d.cats:{exp:JSON.parse(JSON.stringify(DEF_CATS.exp)),inc:JSON.parse(JSON.stringify(DEF_CATS.inc))};
      state.methods=(d.methods&&d.methods.length)?d.methods:JSON.parse(JSON.stringify(DEF_METHODS));
    }
  }catch(e){}
  if(!state.accounts.length)state.accounts=JSON.parse(JSON.stringify(DEF_ACCOUNTS));
  if(!state.goals.length)state.goals=JSON.parse(JSON.stringify(DEF_GOALS));
  if(!has&&!state.subs.length)state.subs=JSON.parse(JSON.stringify(DEF_SUBS));
  if(!state.cats.exp.length)state.cats.exp=JSON.parse(JSON.stringify(DEF_CATS.exp));
  if(!state.cats.inc.length)state.cats.inc=JSON.parse(JSON.stringify(DEF_CATS.inc));
  if(!state.methods.length)state.methods=JSON.parse(JSON.stringify(DEF_METHODS));
  const first=state.accounts[0]?state.accounts[0].id:null;
  state.transactions.forEach(t=>{if(t.type!=="transfer"&&!t.account)t.account=first;});
  // init default selected method if not set
  if(!ui.payForm.method&&state.methods.length)ui.payForm.method=state.methods[0].name;
  if(!ui.subPay.method&&state.methods.length)ui.subPay.method=state.methods[0].name;
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}

/* helpers */
function catByName(n){return[...state.cats.exp,...state.cats.inc].find(c=>c.name===n);}
function catEmoji(n){const c=catByName(n);return c?c.emoji:'⚫';}
function catColor(n){const c=catByName(n);return c?c.color:'#64748B';}
function catInUse(id){const c=[...state.cats.exp,...state.cats.inc].find(x=>x.id===id);return c?state.transactions.some(t=>t.category===c.name):false;}
function methodEmoji(n){const m=state.methods.find(x=>x.name===n);return m?m.emoji:'';}
function methodInUse(id){const m=state.methods.find(x=>x.id===id);return m?state.transactions.some(t=>t.method===m.name):false;}

/* theme */
function currentTheme(){return document.documentElement.getAttribute("data-theme")||"dark";}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  const m=document.getElementById("metaTheme");if(m)m.setAttribute("content",t==="light"?"#F8FAFC":"#09101f");
  const b=document.getElementById("theme");if(b)b.innerHTML=svg(t==="light"?"moon":"sun",'class="icn"');
}
function toggleTheme(){applyTheme(currentTheme()==="light"?"dark":"light");}
function hidden(){return document.documentElement.classList.contains("hidebal");}
function applyHide(on){
  document.documentElement.classList.toggle("hidebal",on);
  try{localStorage.setItem(HIDE_KEY,on?"1":"0");}catch(e){}
  const b=document.getElementById("eye");if(b)b.innerHTML=svg(on?"eyeoff":"eye",'class="icn"');
}
function toggleHide(){applyHide(!hidden());}

/* utils */
function fmt(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2}).format(isFinite(n)?n:0);}
function fmt0(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(isFinite(n)?n:0);}
function mlabel(k){const[y,m]=k.split("-");return MES[+m-1]+" "+y;}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function addCycle(d,c){const n=new Date(d);if(c==="weekly")n.setDate(n.getDate()+7);else if(c==="yearly")n.setFullYear(n.getFullYear()+1);else n.setMonth(n.getMonth()+1);return n;}
function effNext(s){let d=new Date(s.next+"T00:00:00");const t=new Date();t.setHours(0,0,0,0);let i=0;while(d<t&&i<400){d=addCycle(d,s.cycle);i++;}return d;}
function daysLeft(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((effNext(s)-t)/86400000);}
function monthlyEq(s){return s.cycle==="weekly"?s.amount*52/12:s.cycle==="yearly"?s.amount/12:s.amount;}
function cycleLabel(c){return c==="weekly"?"semanal":c==="yearly"?"anual":"mensual";}
function acctById(id){return state.accounts.find(a=>a.id===id);}
function acctName(id){const a=acctById(id);return a?a.name:"—";}
function acctEmoji(id){const a=acctById(id);return a?a.emoji:"⚫";}
function isLiability(a){return a&&(a.type==="card"||a.type==="credit");}
function isDebit(a){return a&&a.type==="debit";}
function typeLabel(t){const m={cash:"Efectivo",bank:"Banco",debit:"Tarjeta de débito",card:"Tarjeta de crédito",crypto:"Cripto / Exchange",invest:"Inversión",other:"Otro"};return m[t]||"Cuenta";}
function realAcctId(id){const a=acctById(id);return(a&&a.type==="debit"&&a.linkedTo)?a.linkedTo:id;}
function realAccounts(){return state.accounts.filter(a=>a.type!=="debit");}
function acctBalance(id){
  const a=acctById(id);if(!a)return 0;
  if(a.type==="debit")return a.linkedTo?acctBalance(a.linkedTo):0;
  let b=a.opening||0;
  state.transactions.forEach(t=>{
    if(t.type==="income"&&realAcctId(t.account)===id)b+=t.amount;
    else if(t.type==="expense"&&realAcctId(t.account)===id)b-=t.amount;
    else if(t.type==="transfer"){if(realAcctId(t.from)===id)b-=t.amount;if(realAcctId(t.to)===id)b+=t.amount;}
  });return b;
}
function netWorth(){return realAccounts().reduce((s,a)=>s+acctBalance(a.id),0);}
function monthTx(){return state.transactions.filter(t=>t.date.startsWith(ui.month));}
function sum(list,type){return list.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0);}
function spentByCat(){const m={};monthTx().filter(t=>t.type==="expense").forEach(t=>m[t.category]=(m[t.category]||0)+t.amount);return m;}
function spentByMethod(){const m={};monthTx().filter(t=>t.type==="expense"&&t.method).forEach(t=>m[t.method]=(m[t.method]||0)+t.amount);return m;}
function shiftMonth(dir){const[y,m]=ui.month.split("-").map(Number);ui.month=mkey(new Date(y,m-1+dir,1));render();}
function defaultAccount(){return state.accounts[0]?state.accounts[0].id:null;}
function capturePayDraft(){
  const a=document.getElementById("pay-amt");if(a)ui.payForm.amt=a.value;
  const n=document.getElementById("pay-note");if(n)ui.payForm.note=n.value;
  const d=document.getElementById("pay-date");if(d)ui.payForm.date=d.value;
}
function clearPayDraft(){ui.payForm.amt="";ui.payForm.note="";ui.payForm.date="";}
function captureSubDraft(){

function emojiPick(sel,action){return '<div class="emoji-pick">'+EMOJIS.map(e=>'<button class="eopt'+(sel===e?" sel":"")+'" data-a="'+action+'" data-e="'+e+'">'+e+'</button>').join("")+'</div>';}

/* ===== views ===== */
function vMonth(){return '<div class="month"><button data-a="mprev">'+svg("chevL",'class="icn"')+'</button><b>'+mlabel(ui.month)+'</b><button data-a="mnext">'+svg("chevR",'class="icn"')+'</button></div>';}
function gauge(pct){const p=Math.max(0,Math.min(100,pct));let t="";[0,25,50,75,100].forEach(n=>t+='<div class="gauge-tick" style="left:'+n+'%"></div>');return '<div><div class="gauge-track"><div class="gauge-fill" style="width:'+p+'%"></div>'+t+'</div><div class="gauge-ends"><span>E</span><span>F</span></div></div>';}

function acctCardBg(colorId){
  const opt=ACCT_COLOR_OPTS.find(o=>o.id===colorId);
  if(!opt)return 'background:var(--surface);border:1px solid var(--line)';
  if(colorId==='dark')return 'background:var(--surface);border:1px solid var(--line)';
  return 'background:'+opt.bg;
}
function acctCard(a,idx){
  const b=acctBalance(a.id);
  const colorId=a.color||(ACCT_COLORS[idx%ACCT_COLORS.length]);
  const isDark=colorId==='dark';
  const balColor=isLiability(a)?(b>=0?'color:#a3e0c7':'color:#fca5a5'):(isDark?(b>=0?'color:var(--text)':'color:var(--red)'):(b>=0?'color:#fff':'color:#fca5a5'));
  const nameColor=isDark?'color:var(--muted)':'color:rgba(255,255,255,.65)';
  const deuda=(isLiability(a)&&b<0)?'<div class="adeuda">deuda</div>':"";
  return '<div class="acct-card" style="'+acctCardBg(colorId)+'"><div class="ah" style="'+nameColor+'"><span>'+a.emoji+'</span>'+esc(a.name)+'</div><div class="ab" style="'+balColor+'">'+fmt(b)+'</div>'+deuda+'</div>';
}
function acctColorPick(sel){
  return '<div class="acct-color-pick">'+ACCT_COLOR_OPTS.map(o=>'<button class="acol'+(sel===o.id?" sel":"")+'" data-a="acctcolor" data-c="'+o.id+'" style="background:'+o.bg+(o.id==='dark'?';border-color:var(--lineS)':'')+'" title="'+o.id+'"></button>').join("")+'</div>';
}

function deltaBadge(cur,prev,goodUp){
  if(prev<=0)return cur>0?'<span class="delta neu">nuevo este mes</span>':'';
  const d=(cur-prev)/prev*100,up=d>=0,good=goodUp?up:!up;
  return '<span class="delta '+(good?"g":"b")+'">'+(up?"▲":"▼")+' '+Math.abs(d).toFixed(0)+'% vs mes ant.</span>';
}

function viewResumen(){
  const mt=monthTx(),inc=sum(mt,"income"),exp=sum(mt,"expense"),av=inc-exp,rate=inc>0?av/inc*100:0;
  const[py,pm]=ui.month.split("-").map(Number);const pmk=mkey(new Date(py,pm-2,1));
  const pmt=state.transactions.filter(t=>t.date.startsWith(pmk));const pinc=sum(pmt,"income"),pexp=sum(pmt,"expense");
  const sc=spentByCat(),tops=Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,4),max=tops.length?tops[0][1]:1;
  const g=state.goals[0];
  const banner=(!ui.installHidden)?'<div class="install"><div>📲 <b>Instálala:</b> menú del navegador → <b>"Agregar a pantalla de inicio"</b>.</div><button class="x" data-a="hideInstall">×</button></div>':"";
  const net=netWorth();
  const acctCards=realAccounts().map((a,i)=>acctCard(a,i)).join('')+'<button class="acct-add" data-a="go" data-tab="cuentas">'+svg("plus")+'<span>Cuentas</span></button>';
  const goalHtml=g?'<button class="goal-hero" data-a="go" data-tab="metas"><div class="g-top"><span class="g-emoji">'+g.emoji+'</span><div><div class="g-name">'+esc(g.name)+'</div><div class="g-nums">'+fmt0(g.saved)+' <span>de '+fmt0(g.target)+'</span></div></div><span class="g-pct">'+(g.target>0?Math.min(100,g.saved/g.target*100).toFixed(0):0)+'%</span></div>'+gauge(g.target>0?g.saved/g.target*100:0)+'</button>':"";
  const catHtml=tops.length===0?'<div class="empty">Aún no hay gastos este mes. Agrégalos en <b>Registrar</b>.</div>':'<div style="display:flex;flex-direction:column;gap:12px">'+tops.map(([c,a])=>'<div class="cat-row"><span class="cat-emoji">'+catEmoji(c)+'</span><div class="cat-body"><div class="cat-line"><span>'+c+'</span><b>'+fmt(a)+'</b></div><div class="bar"><i style="width:'+(a/max*100)+'%;background:'+catColor(c)+'"></i></div></div></div>').join("")+'</div>';
  return '<div class="view fade">'+banner+vMonth()+
    '<div class="readout"><div class="r-label">DISPONIBLE ESTE MES</div><div class="r-val '+(av<0?"neg":"")+'">'+fmt(av)+'</div><div class="r-sub">'+(inc>0?('Ahorras el <b style="color:'+(av>=0?"var(--green)":"var(--red)")+'">'+rate.toFixed(0)+'%</b> de lo que entra'):'Registra ingresos y gastos para ver tu tablero cobrar vida')+'</div></div>'+
    '<div class="stats-grid"><div class="stat-item"><div class="stat-icon2" style="background:rgba(34,197,94,.13)">'+svg("up",'style="width:16px;height:16px;color:var(--green)"')+'</div><div class="stat-num" style="color:var(--green)">'+fmt(inc)+'</div><div class="stat-label">Ingresos</div>'+deltaBadge(inc,pinc,true)+'</div><div class="stat-item"><div class="stat-icon2" style="background:rgba(239,68,68,.12)">'+svg("down",'style="width:16px;height:16px;color:var(--red)"')+'</div><div class="stat-num" style="color:var(--red)">'+fmt(exp)+'</div><div class="stat-label">Gastos</div>'+deltaBadge(exp,pexp,false)+'</div><div class="stat-item"><div class="stat-icon2" style="background:rgba(79,110,247,.14)">'+svg("metas",'style="width:16px;height:16px;color:var(--blue2)"')+'</div><div class="stat-num">'+rate.toFixed(0)+'%</div><div class="stat-label">Tasa de ahorro</div></div><div class="stat-item"><div class="stat-icon2" style="background:rgba(245,177,61,.13)">'+svg("up",'style="width:16px;height:16px;color:var(--amber)"')+'</div><div class="stat-num">'+fmt(net)+'</div><div class="stat-label">Patrimonio</div></div></div>'+
    '<div class="acct-head"><div class="section" style="margin:0">Mis cuentas</div></div>'+
    '<div class="acct-scroll">'+acctCards+'</div>'+
    goalHtml+'<div class="section">Adónde se va tu plata</div>'+catHtml+'</div>';
}

  if(!opts.length)return '<div class="ahint" style="margin:2px">Primero crea una cuenta de banco o efectivo para poder vincular la tarjeta.</div>';
  return '<div class="chips">'+opts.map(a=>'<button class="chip'+(selId===a.id?" sel":"")+'" data-a="acctlink" data-id="'+a.id+'"><span>'+a.emoji+'</span>'+esc(a.name)+'</button>').join("")+'</div>';
}

function acctChipsBlue(selId,action){return state.accounts.map(a=>'<button class="chip'+(selId===a.id?" selb":"")+'" data-a="'+action+'" data-id="'+a.id+'"><span>'+a.emoji+'</span>'+esc(a.name)+'</button>').join("");}

function viewMovimientos(){
  const pf=ui.payForm;
  if(!pf.account||!acctById(pf.account))pf.account=defaultAccount();
  if(!pf.from||!acctById(pf.from))pf.from=defaultAccount();
  if(!pf.to||!acctById(pf.to))pf.to=state.accounts[1]?state.accounts[1].id:defaultAccount();
  const cats=pf.type==="expense"?state.cats.exp:state.cats.inc;
  if(pf.type!=="transfer"&&!cats.find(c=>c.name===pf.cat))pf.cat=cats[0]?cats[0].name:"";
  if(!pf.method&&state.methods.length)pf.method=state.methods[0].name;

  let body="";
  if(pf.type==="transfer"){
    body='<div class="amt"><span>$</span><input id="pay-amt" type="number" inputmode="decimal" placeholder="0.00" value="'+(pf.amt||"")+'"></div>'+
      '<div class="flabel">DE (sale de)</div><div class="chips">'+acctChips(pf.from,"payfrom")+'</div>'+
      '<div class="flabel">A (entra a)</div><div class="chips">'+acctChipsBlue(pf.to,"payto")+'</div>'+
      '<div class="frow"><input id="pay-note" class="txt" placeholder="Nota (ej. pago tarjeta)" value="'+esc(pf.note||"")+'"><input id="pay-date" class="txt date" type="date" value="'+(pf.date||todayISO())+'"></div>'+
      '<button class="add blue" data-a="addtx">'+svg("swap")+' Registrar transferencia</button>';
  }else{
    const catGrid='<div class="cat-grid">'+cats.map(c=>'<button class="cat-item'+(pf.cat===c.name?" sel":"")+'" data-a="paycat" data-cat="'+esc(c.name)+'"><div class="cat-circle" style="background:'+c.color+'22;color:'+c.color+'">'+c.emoji+'</div><div class="cat-name">'+esc(c.name)+'</div></button>').join("")+'</div>';
    const methRow='<div class="method-row">'+state.methods.map(m=>'<button class="mchip'+(pf.method===m.name?" sel":"")+'" data-a="paymethod" data-m="'+esc(m.name)+'">'+m.emoji+' '+esc(m.name)+'</button>').join("")+'</div>';
    body='<div class="amt"><span>$</span><input id="pay-amt" type="number" inputmode="decimal" placeholder="0.00" value="'+(pf.amt||"")+'"></div>'+
      '<div class="flabel">'+(pf.type==="expense"?"PAGUÉ CON (cuenta)":"ENTRÓ A (cuenta)")+'</div><div class="chips">'+acctChips(pf.account,"payacct")+'</div>'+
      '<div class="flabel">MÉTODO <button class="flabel-link" data-a="gocfgmethod">'+svg("plus","")+'editar</button></div>'+methRow+
      '<div class="flabel">CATEGORÍA <button class="flabel-link" data-a="gocfgcat">'+svg("plus","")+'editar</button></div>'+catGrid+
      '<div class="frow"><input id="pay-note" class="txt" placeholder="Nota (opcional)" value="'+esc(pf.note||"")+'"><input id="pay-date" class="txt date" type="date" value="'+(pf.date||todayISO())+'"></div>'+
      '<button class="add" data-a="addtx">'+svg("plus")+' Agregar '+(pf.type==="expense"?"gasto":"ingreso")+'</button>';
  }

  const mt=monthTx();
  const groups={};mt.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});
  const keys=Object.keys(groups).sort((a,b)=>a<b?1:-1);
  const list=keys.length===0?'<div class="empty big">No hay movimientos en '+mlabel(ui.month)+'.<br>Agrega el primero arriba 👆</div>':keys.map(d=>{
    const dd=new Date(d+"T00:00:00").toLocaleDateString("es-EC",{weekday:"short",day:"numeric",month:"short"});
    return '<div class="tx-date">'+dd+'</div>'+groups[d].map(t=>{
      if(t.type==="transfer"){
        return '<div class="tx"><div class="tx-icon" style="background:var(--blue-s)">🔄</div><div class="mid"><div class="c">Transferencia</div><div class="no">'+acctEmoji(t.from)+' '+esc(acctName(t.from))+' → '+acctEmoji(t.to)+' '+esc(acctName(t.to))+(t.note?" · "+esc(t.note):"")+'</div></div><div class="a" style="color:var(--blue)">'+fmt(t.amount)+'</div><button class="del" data-a="deltx" data-id="'+t.id+'">'+svg("trash",'class="icn"')+'</button></div>';
      }
      const cc=catColor(t.category),ce=catEmoji(t.category);

function viewAnalisis(){
  // compact backup bar at bottom
  const backupBar='<div class="section">Datos</div><div class="ana-tools">'+
    '<button class="ana-tool-btn" data-a="export">'+svg("doc",'class="icn"')+'<span>PDF</span></button>'+
    '<button class="ana-tool-btn" data-a="exportData">'+svg("dl",'class="icn"')+'<span>Respaldo</span></button>'+
    '<button class="ana-tool-btn" data-a="importData">'+svg("ul",'class="icn"')+'<span>Importar</span></button>'+
    '</div><div class="ana-hint">Descarga un respaldo antes de cambiar de teléfono o navegador.</div>';

  if(state.transactions.length===0)return '<div class="view fade">'+
    '<div class="empty big" style="margin-top:8px">Tus gráficos aparecen aquí en cuanto registres movimientos.<br>Empieza por <b>Registrar</b> y vuelve. 📊</div>'+
    backupBar+'</div>';

  const sc=spentByCat(),pie=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const tot=pie.reduce((s,[,v])=>s+v,0);
  let donut="",leg="";
  if(pie.length){
    let acc=0;
    const segs=pie.map(([n,v])=>{const from=acc/tot*360;acc+=v;const to=acc/tot*360;return catColor(n)+" "+from+"deg "+to+"deg";});
    donut='<div class="donut" style="background:conic-gradient('+segs.join(",")+')"></div>';
    leg=pie.slice(0,7).map(([n,v])=>'<div class="li"><span class="dot" style="background:'+catColor(n)+'"></span><span class="ln">'+catEmoji(n)+' '+n+'</span><b>'+fmt(v)+'</b></div>').join("");
  }

  const[y,m]=ui.month.split("-").map(Number);let cols=[],maxV=1;
  for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),k=mkey(d),tx=state.transactions.filter(t=>t.date.startsWith(k));const ing=sum(tx,"income"),gas=sum(tx,"expense");maxV=Math.max(maxV,ing,gas);cols.push({mes:MES[d.getMonth()],ing,gas});}
  const bars=cols.map(c=>'<div class="col"><div class="bars"><div class="bi" style="height:'+(c.ing/maxV*100)+'%;background:var(--green)"></div><div class="bi" style="height:'+(c.gas/maxV*100)+'%;background:var(--red)"></div></div><div class="lbl">'+c.mes+'</div></div>').join("");
  const barLegend='<div class="bar-legend"><span class="bl-dot" style="background:var(--green)"></span>Ingresos<span class="bl-dot" style="background:var(--red);margin-left:12px"></span>Gastos</div>';

  const sm=spentByMethod(),me=Object.entries(sm).sort((a,b)=>b[1]-a[1]),mx=me.length?me[0][1]:1;
  const methSection=me.length?'<div class="section">Por método de pago</div><div class="chart"><div style="display:flex;flex-direction:column;gap:12px">'+me.map(([mn,v])=>'<div class="cat-row"><span class="cat-emoji">'+methodEmoji(mn)+'</span><div class="cat-body"><div class="cat-line"><span>'+mn+'</span><b>'+fmt(v)+'</b></div><div class="bar"><i style="width:'+(v/mx*100)+'%;background:var(--blue)"></i></div></div></div>').join("")+'</div></div>':"";

  return '<div class="view fade">'+vMonth()+
    '<div class="section" style="margin-top:2px">Gastos · '+mlabel(ui.month)+'</div>'+
    (pie.length
      ? '<div class="chart"><div class="donut-wrap">'+donut+'<div class="legend">'+leg+'</div></div></div>'
      : '<div class="empty">Sin gastos este mes.</div>')+
    '<div class="section">Ingresos vs. gastos · 6 meses</div>'+
    '<div class="chart"><div class="m6">'+bars+'</div>'+barLegend+'</div>'+
    methSection+
    backupBar+'</div>';
}

/* ===== PDF report ===== */
function buildReport(){
  const k=ui.month,mt=state.transactions.filter(t=>t.date.startsWith(k));
  const inc=sum(mt,"income"),exp=sum(mt,"expense"),av=inc-exp,rate=inc>0?av/inc*100:0;
  const sc={};mt.filter(t=>t.type==="expense").forEach(t=>sc[t.category]=(sc[t.category]||0)+t.amount);
  const cats=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const now=new Date().toLocaleDateString("es-EC",{day:"numeric",month:"long",year:"numeric"});
  let html='<div class="rep-head"><h1>Tablero · Resumen de '+mlabel(k)+'</h1><div class="sub">Generado el '+now+'</div></div>';
  html+='<div class="rep-kpis"><div class="rep-kpi"><div class="l">Ingresos</div><div class="v pos">'+fmt(inc)+'</div></div><div class="rep-kpi"><div class="l">Gastos</div><div class="v neg">'+fmt(exp)+'</div></div><div class="rep-kpi"><div class="l">Disponible</div><div class="v '+(av>=0?"pos":"neg")+'">'+fmt(av)+'</div></div><div class="rep-kpi"><div class="l">Tasa de ahorro</div><div class="v">'+rate.toFixed(0)+'%</div></div></div>';
  html+='<div class="rep-sec"><h2>Cuentas</h2><table class="rep"><tbody>';
  state.accounts.forEach(a=>{const b=acctBalance(a.id);html+='<tr><td>'+a.emoji+' '+esc(a.name)+'</td><td class="n '+(b>=0?"pos":"neg")+'">'+fmt(b)+'</td></tr>';});
  html+='<tr><td><b>Patrimonio neto</b></td><td class="n"><b>'+fmt(netWorth())+'</b></td></tr></tbody></table></div>';
  if(cats.length){html+='<div class="rep-sec"><h2>Gastos por categoría</h2><table class="rep"><tbody>';
    cats.forEach(([c,v])=>html+='<tr><td>'+catEmoji(c)+' '+c+'</td><td class="n">'+fmt(v)+'</td></tr>');
    html+='</tbody></table></div>';}
  const smr={};mt.filter(t=>t.type==="expense"&&t.method).forEach(t=>smr[t.method]=(smr[t.method]||0)+t.amount);
  const methEnt=Object.entries(smr).sort((a,b)=>b[1]-a[1]);
  if(methEnt.length){html+='<div class="rep-sec"><h2>Gastos por método de pago</h2><table class="rep"><tbody>';
    methEnt.forEach(([mm,v])=>html+='<tr><td>'+mm+'</td><td class="n">'+fmt(v)+'</td></tr>');
    html+='</tbody></table></div>';}
  if(state.subs.length){html+='<div class="rep-sec"><h2>Pagos recurrentes</h2><table class="rep"><thead><tr><th>Servicio</th><th>Ciclo</th><th class="n">Monto</th></tr></thead><tbody>';
    state.subs.forEach(s=>html+='<tr><td>'+s.emoji+' '+esc(s.name)+'</td><td>'+cycleLabel(s.cycle)+'</td><td class="n">'+fmt(s.amount)+'</td></tr>');
    html+='</tbody></table></div>';}
  if(state.goals.length){html+='<div class="rep-sec"><h2>Metas</h2><table class="rep"><thead><tr><th>Meta</th><th class="n">Ahorrado</th><th class="n">Objetivo</th><th class="n">%</th></tr></thead><tbody>';
    state.goals.forEach(g=>{const p=g.target>0?Math.min(100,g.saved/g.target*100):0;html+='<tr><td>'+g.emoji+' '+esc(g.name)+'</td><td class="n">'+fmt0(g.saved)+'</td><td class="n">'+fmt0(g.target)+'</td><td class="n">'+p.toFixed(0)+'%</td></tr>';});
    html+='</tbody></table></div>';}
  html+='<div class="rep-sec"><h2>Últimos 6 meses</h2><table class="rep"><thead><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Gastos</th><th class="n">Balance</th></tr></thead><tbody>';
  const[yy,mm]=ui.month.split("-").map(Number);
  for(let i=5;i>=0;i--){const d=new Date(yy,mm-1-i,1),kk=mkey(d),tx=state.transactions.filter(t=>t.date.startsWith(kk));const ing=sum(tx,"income"),gas=sum(tx,"expense"),bal=ing-gas;html+='<tr><td>'+mlabel(kk)+'</td><td class="n">'+fmt(ing)+'</td><td class="n">'+fmt(gas)+'</td><td class="n '+(bal>=0?"pos":"neg")+'">'+fmt(bal)+'</td></tr>';}
  html+='</tbody></table></div><div class="rep-foot">Generado con Tablero · tus finanzas personales</div>';
  return html;
}
function exportPDF(){document.getElementById("print-area").innerHTML=buildReport();setTimeout(()=>window.print(),60);}

function exportData(){
  try{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="tablero-respaldo-"+todayISO()+".json";document.body.appendChild(a);a.click();
    document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){alert("No pude generar el respaldo.");}
}
function handleImportFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);
      if(!d||typeof d!=="object")throw 0;
      if(!confirm("Esto reemplazará tus datos actuales por los del archivo. ¿Continuar?"))return;
      state={accounts:d.accounts||[],transactions:d.transactions||[],budgets:d.budgets||{},goals:d.goals||[],subs:d.subs||[],
        cats:(d.cats&&d.cats.exp&&d.cats.exp.length)?d.cats:{exp:JSON.parse(JSON.stringify(DEF_CATS.exp)),inc:JSON.parse(JSON.stringify(DEF_CATS.inc))},
        methods:(d.methods&&d.methods.length)?d.methods:JSON.parse(JSON.stringify(DEF_METHODS))};
      if(!state.accounts.length)state.accounts=JSON.parse(JSON.stringify(DEF_ACCOUNTS));
      const first=state.accounts[0].id;
      state.transactions.forEach(t=>{if(t.type!=="transfer"&&!t.account)t.account=first;});
      save();ui.tab="resumen";render();alert("✅ Datos importados correctamente.");
    }catch(e){alert("No pude leer el archivo. Asegúrate de que sea un respaldo de Tablero válido (.json).");}
  };r.readAsText(file);
}

function render(){
  const views={resumen:viewResumen,cuentas:viewCuentas,movimientos:viewMovimientos,presupuesto:viewPresupuesto,subs:viewSubs,metas:viewMetas,analisis:viewAnalisis,config:viewConfig};
  document.getElementById("main").innerHTML=(views[ui.tab]||viewResumen)();
  const tabs=[["resumen","resumen","Resumen"],["movimientos","mov","Registrar"],["presupuesto","presu","Presu"],["subs","subs","Pagos"],["metas","metas","Metas"],["analisis","ana","Análisis"]];
  const active=(ui.tab==="cuentas"||ui.tab==="config")?"resumen":ui.tab;
  document.getElementById("nav").innerHTML=tabs.map(([k,ic,l])=>'<button class="nb'+(active===k?" on":"")+'" data-a="nav" data-tab="'+k+'">'+svg(ic)+'<b>'+l+'</b></button>').join("");
}

document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;

  // capture in-flight drafts
  if(["paytype","paycat","paymethod","payacct","payfrom","payto"].includes(a))capturePayDraft();
  if(["subemoji","subcycle"].includes(a))captureSubDraft();
  if(a==="goalemoji")captureGoalDraft();
  if(["acctemoji","accttype","acctlink","acctcolor"].includes(a))captureAcctDraft();
  if(["cfgemoji","cfgcolor","cfgcattype","cfgmemoji"].includes(a))captureCfgName();

  /* ── nav ── */
  if(a==="nav"||a==="go"){
    ui.tab=el.dataset.tab;ui.addGoal=false;ui.addSub=false;ui.addAcct=false;
    ui.contribFor=null;ui.editAcct=null;ui.editGoal=null;ui.editSub=null;ui.payingSub=null;
    render();window.scrollTo(0,0);
  }
  else if(a==="closecfg"){ui.tab=ui._prevTab||"resumen";ui._prevTab=null;render();window.scrollTo(0,0);}

  /* ── month nav ── */
  else if(a==="mprev")shiftMonth(-1);
  else if(a==="mnext")shiftMonth(1);
  else if(a==="hideInstall"){ui.installHidden=true;render();}

  /* ── tx type / cat / method ── */
  else if(a==="paytype"){ui.payForm.type=el.dataset.type;render();}
  else if(a==="paycat"){ui.payForm.cat=el.dataset.cat;render();}
  else if(a==="paymethod"){ui.payForm.method=el.dataset.m;render();}
  else if(a==="payacct"){ui.payForm.account=el.dataset.id;render();}
  else if(a==="payfrom"){ui.payForm.from=el.dataset.id;render();}
  else if(a==="payto"){ui.payForm.to=el.dataset.id;render();}

  /* ── shortcuts from mov form to config ── */
  else if(a==="gocfgcat"){capturePayDraft();ui._prevTab=ui.tab;ui.tab="config";ui.cfg.section="cats";ui.cfg.catType=ui.payForm.type==="income"?"inc":"exp";render();window.scrollTo(0,0);}
  else if(a==="gocfgmethod"){capturePayDraft();ui._prevTab=ui.tab;ui.tab="config";ui.cfg.section="methods";render();window.scrollTo(0,0);}

  /* ── add tx ── */
  else if(a==="addtx"){
    const amt=parseFloat(document.getElementById("pay-amt").value);if(!amt||amt<=0)return;
    const note=document.getElementById("pay-note").value.trim(),date=document.getElementById("pay-date").value||todayISO();
    if(ui.payForm.type==="transfer"){
      if(ui.payForm.from===ui.payForm.to){alert("Elige dos cuentas distintas para la transferencia.");return;}
      state.transactions.unshift({id:uid(),type:"transfer",amount:amt,from:ui.payForm.from,to:ui.payForm.to,note,date});
    }else{
      state.transactions.unshift({id:uid(),type:ui.payForm.type,amount:amt,category:ui.payForm.cat,account:ui.payForm.account,method:ui.payForm.method,note,date});
    }
    save();clearPayDraft();render();
  }
  else if(a==="deltx"){state.transactions=state.transactions.filter(t=>t.id!==el.dataset.id);save();render();}
  else if(a==="canceledit"){ui.editAcct=null;ui.editGoal=null;ui.editSub=null;render();}

  /* ── subs ── */
  else if(a==="toggleSub"){ui.addSub=!ui.addSub;ui.editSub=null;if(ui.addSub)ui.subForm={cycle:"monthly",emoji:"🔁",name:"",amt:"",date:""};render();}
  else if(a==="subcycle"){ui.subForm.cycle=el.dataset.c;render();}
  else if(a==="subemoji"){ui.subForm.emoji=el.dataset.e;render();}
  else if(a==="addsub"){
    const name=document.getElementById("sub-name").value.trim(),amt=parseFloat(document.getElementById("sub-amt").value);
    const date=document.getElementById("sub-date").value||plusDays(30);
    if(!name||!amt||amt<=0)return;
    state.subs.push({id:uid(),name,amount:amt,cycle:ui.subForm.cycle,next:date,emoji:ui.subForm.emoji});
    ui.addSub=false;ui.subForm={cycle:"monthly",emoji:"🔁",name:"",amt:"",date:""};save();render();
  }
  else if(a==="editsub"){const s=state.subs.find(x=>x.id===el.dataset.id);if(s){ui.editSub=s.id;ui.addSub=false;ui.subForm={cycle:s.cycle,emoji:s.emoji,name:s.name,amt:s.amount,date:s.next};render();}}
  else if(a==="savesub"){
    const s=state.subs.find(x=>x.id===el.dataset.id);if(!s)return;
    const name=document.getElementById("edit-sub-name").value.trim(),amt=parseFloat(document.getElementById("edit-sub-amt").value);
    const date=document.getElementById("edit-sub-date").value||s.next;
    if(!name||!amt||amt<=0){alert("Pon un nombre y un monto válido.");return;}
    s.name=name;s.amount=amt;s.cycle=ui.subForm.cycle;s.next=date;s.emoji=ui.subForm.emoji;
    ui.editSub=null;save();render();
  }
  else if(a==="paysub"){const s=state.subs.find(x=>x.id===el.dataset.id);if(!s)return;ui.payingSub=s.id;ui.subPay={account:defaultAccount(),method:state.methods[0]?state.methods[0].name:"Débito"};render();}
  else if(a==="subpayacct"){ui.subPay.account=el.dataset.id;render();}
  else if(a==="subpaymethod"){ui.subPay.method=el.dataset.m;render();}
  else if(a==="cancelsubpay"){ui.payingSub=null;render();}
  else if(a==="confirmsub"){
    const s=state.subs.find(x=>x.id===el.dataset.id);if(!s)return;
    const cat=state.cats.exp.find(c=>c.name==="Suscripciones");
    state.transactions.unshift({id:uid(),type:"expense",amount:s.amount,category:cat?cat.name:"Suscripciones",account:ui.subPay.account,method:ui.subPay.method,note:s.name,date:todayISO()});
    s.next=addCycle(effNext(s),s.cycle).toISOString().slice(0,10);ui.payingSub=null;save();render();
  }
  else if(a==="delsub"){if(confirm("¿Eliminar este pago recurrente?")){state.subs=state.subs.filter(x=>x.id!==el.dataset.id);ui.editSub=null;save();render();}}

  /* ── goals ── */
  else if(a==="toggleGoal"){ui.addGoal=!ui.addGoal;ui.editGoal=null;if(ui.addGoal){ui.goalEmoji="🎯";ui.goalName="";ui.goalTarget="";}render();}
  else if(a==="goalemoji"){ui.goalEmoji=el.dataset.e;render();}
  else if(a==="addgoal"){
    const name=document.getElementById("goal-name").value.trim(),target=parseFloat(document.getElementById("goal-target").value);
    if(!name||!target||target<=0)return;
    state.goals.push({id:uid(),name,target,saved:0,emoji:ui.goalEmoji});
    ui.addGoal=false;ui.goalEmoji="🎯";ui.goalName="";ui.goalTarget="";save();render();
  }
  else if(a==="editgoal"){const g=state.goals.find(x=>x.id===el.dataset.id);if(g){ui.editGoal=g.id;ui.addGoal=false;ui.contribFor=null;ui.goalEmoji=g.emoji;ui.goalName=g.name;ui.goalTarget=g.target;render();}}
  else if(a==="savegoal"){
    const g=state.goals.find(x=>x.id===el.dataset.id);if(!g)return;
    const name=document.getElementById("edit-goal-name").value.trim(),target=parseFloat(document.getElementById("edit-goal-target").value);
    if(!name||!target||target<=0){alert("Pon un nombre y un objetivo válido.");return;}
    g.name=name;g.target=target;g.emoji=ui.goalEmoji;ui.editGoal=null;save();render();
  }
  else if(a==="delgoal"){const g=state.goals.find(x=>x.id===el.dataset.id);if(confirm('¿Eliminar la meta "'+(g?g.name:"")+('"?'))){state.goals=state.goals.filter(x=>x.id!==el.dataset.id);ui.editGoal=null;save();render();}}
  else if(a==="startcontrib"){ui.contribFor=el.dataset.id;render();setTimeout(()=>{const i=document.getElementById("contrib-amt");if(i)i.focus();},50);}
  else if(a==="cancelcontrib"){ui.contribFor=null;render();}
  else if(a==="docontrib"){const amt=parseFloat(document.getElementById("contrib-amt").value);if(!amt)return;const g=state.goals.find(x=>x.id===el.dataset.id);if(g)g.saved=Math.max(0,g.saved+amt);ui.contribFor=null;save();render();}

  /* ── cuentas ── */
  else if(a==="toggleAcct"){ui.addAcct=!ui.addAcct;ui.editAcct=null;if(ui.addAcct)ui.acctForm={type:"bank",emoji:"🏦",linkedTo:null,name:"",opening:"",color:"blue"};render();}
  else if(a==="accttype"){
    ui.acctForm.type=el.dataset.t;
    const map={cash:"💵",bank:"🏦",debit:"💳",card:"🧾",crypto:"🪙",invest:"📈",other:"👛"};
    ui.acctForm.emoji=map[el.dataset.t]||ui.acctForm.emoji;
    if(el.dataset.t==="debit"&&!ui.acctForm.linkedTo){const r=realAccounts().filter(x=>x.id!==ui.editAcct);ui.acctForm.linkedTo=r[0]?r[0].id:null;}
    render();
  }
  else if(a==="acctlink"){ui.acctForm.linkedTo=el.dataset.id;render();}
  else if(a==="acctemoji"){ui.acctForm.emoji=el.dataset.e;render();}
  else if(a==="acctcolor"){ui.acctForm.color=el.dataset.c;render();}
  else if(a==="addacct"){
    const name=document.getElementById("acct-name").value.trim();if(!name){alert("Ponle un nombre a la cuenta.");return;}
    if(ui.acctForm.type==="debit"){
      if(!ui.acctForm.linkedTo){alert("Elige de qué cuenta saca la plata la tarjeta de débito.");return;}
      state.accounts.push({id:uid(),name,type:"debit",opening:0,emoji:ui.acctForm.emoji,linkedTo:ui.acctForm.linkedTo,color:ui.acctForm.color||"dark"});
    }else{
      const opening=parseFloat(document.getElementById("acct-opening").value)||0;
      state.accounts.push({id:uid(),name,type:ui.acctForm.type,opening,emoji:ui.acctForm.emoji,color:ui.acctForm.color||"blue"});
    }
    ui.addAcct=false;ui.acctForm={type:"bank",emoji:"🏦",linkedTo:null,name:"",opening:"",color:"blue"};save();render();
  }
  else if(a==="editacct"){const ac=acctById(el.dataset.id);if(ac){ui.editAcct=ac.id;ui.addAcct=false;ui.acctForm={type:ac.type,emoji:ac.emoji,linkedTo:ac.linkedTo||null,name:ac.name,opening:(ac.opening!==undefined?ac.opening:""),color:ac.color||"blue"};render();}}
  else if(a==="saveacct"){
    const ac=acctById(el.dataset.id);if(!ac)return;
    const name=document.getElementById("edit-acct-name").value.trim();if(!name){alert("Ponle un nombre a la cuenta.");return;}
    ac.name=name;ac.type=ui.acctForm.type;ac.emoji=ui.acctForm.emoji;ac.color=ui.acctForm.color||"blue";
    if(ui.acctForm.type==="debit"){
      if(!ui.acctForm.linkedTo){alert("Elige de qué cuenta saca la plata la tarjeta de débito.");return;}
      ac.linkedTo=ui.acctForm.linkedTo;delete ac.opening;
    }else{ac.opening=parseFloat(document.getElementById("edit-acct-opening").value)||0;delete ac.linkedTo;}
    ui.editAcct=null;save();render();
  }
  else if(a==="delacct"){
    if(state.accounts.length<=1){alert("Necesitas al menos una cuenta.");return;}
    const ac=acctById(el.dataset.id);
    if(confirm('¿Eliminar la cuenta "'+(ac?ac.name:"")+'"?')){state.accounts=state.accounts.filter(x=>x.id!==el.dataset.id);ui.editAcct=null;save();render();}
  }

  /* ── config cats ── */
  else if(a==="cfgsection"){ui.cfg.section=el.dataset.s;ui.cfg.addCat=false;ui.cfg.editCatId=null;ui.cfg.addMethod=false;ui.cfg.editMethodId=null;render();}
  else if(a==="cfgcattype"){ui.cfg.catType=el.dataset.t;ui.cfg.addCat=false;ui.cfg.editCatId=null;render();}
  else if(a==="cfgaddtoggle"){ui.cfg.addCat=!ui.cfg.addCat;ui.cfg.editCatId=null;if(ui.cfg.addCat)ui.cfg.catForm={name:'',emoji:'💰',color:'#4F6EF7'};render();}
  else if(a==="cfgemoji"){ui.cfg.catForm.emoji=el.dataset.e;render();}
  else if(a==="cfgcolor"){ui.cfg.catForm.color=el.dataset.c;render();}
  else if(a==="cfgsave"){
    const name=document.getElementById("cfg-name").value.trim();
    if(!name){alert("Ponle un nombre a la categoría.");return;}
    const list=ui.cfg.catType==='exp'?state.cats.exp:state.cats.inc;
    if(list.find(c=>c.name.toLowerCase()===name.toLowerCase())){alert("Ya existe una categoría con ese nombre.");return;}
    list.push({id:uid(),name,emoji:ui.cfg.catForm.emoji,color:ui.cfg.catForm.color});
    ui.cfg.addCat=false;ui.cfg.catForm={name:'',emoji:'💰',color:'#4F6EF7'};save();render();
  }
  else if(a==="cfgedit"){
    const list=[...state.cats.exp,...state.cats.inc],c=list.find(x=>x.id===el.dataset.id);
    if(c){ui.cfg.editCatId=c.id;ui.cfg.addCat=false;ui.cfg.catForm={name:c.name,emoji:c.emoji,color:c.color};render();}
  }
  else if(a==="cfgesave"){
    const name=document.getElementById("cfg-ename").value.trim();if(!name){alert("Ponle un nombre.");return;}
    const list=ui.cfg.catType==='exp'?state.cats.exp:state.cats.inc;
    const c=list.find(x=>x.id===ui.cfg.editCatId);if(!c)return;
    const oldName=c.name;
    c.name=name;c.emoji=ui.cfg.catForm.emoji;c.color=ui.cfg.catForm.color;
    // update transactions & budgets
    state.transactions.forEach(t=>{if(t.category===oldName)t.category=name;});
    if(state.budgets[oldName]!==undefined){state.budgets[name]=state.budgets[oldName];delete state.budgets[oldName];}
    ui.cfg.editCatId=null;ui.cfg.catForm={name:'',emoji:'💰',color:'#4F6EF7'};save();render();
  }
  else if(a==="cfgcancel"){ui.cfg.addCat=false;ui.cfg.editCatId=null;ui.cfg.addMethod=false;ui.cfg.editMethodId=null;render();}
  else if(a==="cfgdel"){
    if(catInUse(el.dataset.id)){alert("Esta categoría está en uso. Elimina o reasigna los movimientos que la usan primero.");return;}
    const expI=state.cats.exp.findIndex(x=>x.id===el.dataset.id);
    if(expI>=0)state.cats.exp.splice(expI,1);
    else{const incI=state.cats.inc.findIndex(x=>x.id===el.dataset.id);if(incI>=0)state.cats.inc.splice(incI,1);}
    save();render();
  }

  /* ── config methods ── */
  else if(a==="cfgmaddtoggle"){ui.cfg.addMethod=!ui.cfg.addMethod;ui.cfg.editMethodId=null;if(ui.cfg.addMethod)ui.cfg.methodForm={name:'',emoji:'💵'};render();}
  else if(a==="cfgmemoji"){ui.cfg.methodForm.emoji=el.dataset.e;render();}
  else if(a==="cfgmsave"){
    const name=document.getElementById("cfg-mname").value.trim();if(!name){alert("Ponle un nombre al método.");return;}
    if(state.methods.find(m=>m.name.toLowerCase()===name.toLowerCase())){alert("Ya existe un método con ese nombre.");return;}
    state.methods.push({id:uid(),name,emoji:ui.cfg.methodForm.emoji});
    ui.cfg.addMethod=false;ui.cfg.methodForm={name:'',emoji:'💵'};save();render();
  }
  else if(a==="cfgmedit"){
    const m=state.methods.find(x=>x.id===el.dataset.id);
    if(m){ui.cfg.editMethodId=m.id;ui.cfg.addMethod=false;ui.cfg.methodForm={name:m.name,emoji:m.emoji};render();}
  }
  else if(a==="cfgmesave"){
    const name=document.getElementById("cfg-mename").value.trim();if(!name){alert("Ponle un nombre.");return;}
    const m=state.methods.find(x=>x.id===ui.cfg.editMethodId);if(!m)return;
    const oldName=m.name;m.name=name;m.emoji=ui.cfg.methodForm.emoji;
    state.transactions.forEach(t=>{if(t.method===oldName)t.method=name;});
    ui.cfg.editMethodId=null;ui.cfg.methodForm={name:'',emoji:'💵'};save();render();
  }
  else if(a==="cfgmcancel"){ui.cfg.addMethod=false;ui.cfg.editMethodId=null;render();}
  else if(a==="cfgmdel"){
    if(methodInUse(el.dataset.id)){alert("Este método está en uso. Elimina o reasigna los movimientos que lo usan primero.");return;}
    if(state.methods.length<=1){alert("Necesitas al menos un método de pago.");return;}
    state.methods=state.methods.filter(x=>x.id!==el.dataset.id);save();render();
  }

  /* ── analytics / export ── */
  else if(a==="export")exportPDF();
  else if(a==="exportData")exportData();
  else if(a==="importData")document.getElementById("importFile").click();
});

document.body.addEventListener("change",e=>{
  const b=e.target.closest('[data-a="setbudget"]');
  if(b){state.budgets[b.dataset.cat]=parseFloat(b.value)||0;save();render();return;}
});
document.body.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="pay-amt"){const b=document.querySelector('[data-a="addtx"]');if(b)b.click();}
  if(e.target.id==="contrib-amt"){const b=document.querySelector('[data-a="docontrib"]');if(b)b.click();}
});

  const manifest={name:"Tablero",short_name:"Tablero",start_url:".",display:"standalone",background_color:"#09101f",theme_color:"#09101f",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};

applyTheme(currentTheme());
try{applyHide(localStorage.getItem(HIDE_KEY)==="1");}catch(e){applyHide(false);}
load();render();
